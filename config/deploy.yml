# Name of your application. Used to uniquely configure containers.
service: shitcoinswap

# Name of the container image.
image: buhrmi/shitcoinswap

# Deploy to these servers.
servers:
  web:
    hosts:
      - 195.201.36.212
    options:
      network: "private"
      
    labels:
      traefik.http.routers.shitcoinswap.entrypoints: websecure
      traefik.http.routers.shitcoinswap.rule: (Host(`www.shitcoinswap.com`) || Host(`shitcoinswap.com`))
      traefik.http.routers.shitcoinswap.tls.certresolver: letsencrypt
      traefik.http.routers.shitcoinswap.middlewares: add-www-shitcoinswap
      traefik.http.middlewares.add-www-shitcoinswap.redirectregex.regex: ^https://shitcoinswap.com/(.*)
      traefik.http.middlewares.add-www-shitcoinswap.redirectregex.replacement: https://www.shitcoinswap.com/$1
  # scanner:
  #   hosts:
  #     - 195.201.36.212
  #   options:
  #     network: "private"
  #   cmd: "bundle exec rails runner 'Scanner.run'"


volumes:
  - "/storage:/rails/storage"


# Credentials for your image host.
registry:
  # Specify the registry server, if you're not using Docker Hub
  server: registry.buhrmi.de
  username: buhrmi

  # Always use an access token rather than real password when possible.
  password:
    - KAMAL_REGISTRY_PASSWORD
    # - DOCKER_HUB_TOKEN

# Inject ENV variables into containers (secrets come from .env).
# Remember to run `kamal env push` after making changes!
env:
  clear:
    HOSTNAME: www.shitcoinswap.com
    DB_HOST: 195.201.36.212
    RAILS_LOG_TO_STDOUT: 1
    RAILS_SERVE_STATIC_FILES: 1
    RUBY_YJIT_ENABLE: 1
    RAILS_ENV: testing
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD

# Use a different ssh user than root
# ssh:
#   user: app

# Configure builder setup.
builder:
#   args:
#     RUBY_VERSION: 3.2.0
#   secrets:
#     - GITHUB_TOKEN
  remote:
    arch: amd64
    host: ssh://root@195.201.36.212

# Use accessory services (secrets come from .env).
accessories:
  db:
    image: postgres:15
    host: 195.201.36.212
    port: 5432
    env:
      clear:
        POSTGRES_USER: 'shitcoinswap'
        POSTGRES_DB: 'shitcoinswap_production'
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    roles:
      - web
      # - scanner
    cmd: "redis-server --requirepass <%= ENV['REDIS_PASSWORD'] %>"
    volumes:
      - /var/lib/redis:/data
    options:
      network: "private"

  registry:
    image: registry:2
    host: 195.201.36.212
    port: 5000
    directories:
    volumes:
      - /root/auth:/auth
      # - /var/lib/registry:/var/lib/registry
    options:
      network: "private"
    env:
      clear:
        REGISTRY_AUTH: htpasswd
        REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
        REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
    labels:
      traefik.http.routers.registry.entrypoints: websecure
      traefik.http.routers.registry.rule: Host(`registry.buhrmi.de`)
      traefik.http.routers.registry.tls.certresolver: letsencrypt
    

# Configure custom arguments for Traefik
traefik:
  options:
    publish:
      - "443:443/tcp"
      - "443:443/udp"
    volume:
      - "/letsencrypt/acme.json:/letsencrypt/acme.json"
    network: "private"
  args:
    entryPoints.web.address: ":80"
    entryPoints.web.http.redirections.entryPoint.to: websecure
    entryPoints.web.http.redirections.entryPoint.scheme: https
    entryPoints.web.http.redirections.entrypoint.permanent: true
    entryPoints.websecure.address: ":443"
    entryPoints.websecure.http3:
    certificatesResolvers.letsencrypt.acme.email: "buhrmi@gmail.com"
    certificatesResolvers.letsencrypt.acme.storage: "/letsencrypt/acme.json"
    certificatesResolvers.letsencrypt.acme.httpchallenge: true
    certificatesResolvers.letsencrypt.acme.httpchallenge.entrypoint: web
    experimental.http3: true
    

# Configure a custom healthcheck (default is /up on port 3000)
healthcheck:
#   path: /healthz
#   port: 4000
  log_lines: 200

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/vite

# Configure rolling deploys by setting a wait time between batches of restarts.
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2
